name: Publish

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: publish-release-pypi-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release-tag:
    name: Verify release tag
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check out the selected revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11'
      - name: Require the exact version tag
        env:
          RELEASE_REF: ${{ github.ref }}
        run: python scripts/check_release.py "$RELEASE_REF"

  validate:
    name: Validate the release revision
    needs: release-tag
    uses: ./.github/workflows/ci.yml

  publish:
    name: Publish to PyPI
    needs: [release-tag, validate]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment:
      name: pypi
      url: https://pypi.org/p/fastapi-cordis
    permissions:
      id-token: write
    steps:
      - name: Download the distributions validated in this run
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: distributions-${{ github.sha }}
          path: dist/
      - name: Upload with Trusted Publishing
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          repository-url: https://upload.pypi.org/legacy/
          packages-dir: dist/
